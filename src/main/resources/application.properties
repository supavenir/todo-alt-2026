spring.application.name=todo-alt
spring.mustache.prefix=classpath:/templates/
spring.mustache.suffix=.hbs

spring.datasource.url=jdbc:h2:file:./data/todo;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

# Mise a jour automatique de la Db en fonction des entities
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Activation de la console h2 (penser a ajouter le springboot starter h2console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# quotes ajoutees sur les noms de tables et de champs : preserve la casse
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# logs the SQL statements
# basic log level for all messages
logging.level.org.hibernate=info
# SQL statements and parameters
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace